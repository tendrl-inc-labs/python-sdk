name: CI — Python SDK

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the real floor (client.py imports zoneinfo); 3.12 is the common case.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          pip install -e .
          pip install -r tests/requirements.txt

      # The suite needs no Tendrl backend — it runs against a local recording
      # HTTP server. That is what keeps it from skipping itself into a false
      # green, so there is no "tests required" escape hatch to set here.
      - name: Run tests
        run: pytest
